<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Event System - Attendees</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background-color: #f0f8ff; color: #333; }
h2 { color: #2c3e50; }
table { border-collapse: collapse; width: 60%; margin-top: 20px; }
th, td { border: 1px solid #555; padding: 8px; text-align: left; }
input, button { margin: 5px 0; padding: 5px; }
button { cursor: pointer; background-color: #27ae60; color: #fff; border: none; border-radius: 5px; }
button:hover { background-color: #1e8449; }
</style>
<script>
function validateForm() {
    let name = document.forms["attendeeForm"]["name"].value;
    let email = document.forms["attendeeForm"]["email"].value;
    if(name=="" || email=="") {
        alert("Both fields are required!");
        return false;
    }
    return true;
}
</script>
</head>
<body>

<h2>Attendees</h2>

<form name="attendeeForm" onsubmit="return validateForm()">
    Name: <input type="text" name="name">
    Email: <input type="email" name="email">
    <button type="submit">Add Attendee</button>
</form>

<table>
<tr><th>ID</th><th>Name</th><th>Email</th></tr>
<tr><td>1</td><td>Alice</td><td>alice@email.com</td></tr>
<tr><td>2</td><td>Bob</td><td>bob@email.com</td></tr>
<tr><td>3</td><td>Charlie</td><td>charlie@email.com</td></tr>
</table>

</body>
</html>
